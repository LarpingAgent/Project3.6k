[workspace]
members = [
    "crates/project3-6k-assets",
    "crates/project3-6k-core",
    "crates/project3-6k-platform",
    "crates/project3-6k-vulkan",
    "crates/project3-6k-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ash = "0.38.0"
ash-window = "0.13.0"
base64 = "0.22.1"
glam = "0.34.3"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
image = { version = "=0.25.9", default-features = false, features = ["bmp", "jpeg", "png", "tga", "webp"] }
png = "0.18.1"
project3-6k-core = { path = "crates/project3-6k-core" }
project3-6k-assets = { path = "crates/project3-6k-assets" }
raw-window-handle = "0.6.2"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
